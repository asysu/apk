name: Build APK and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test coach service
        run: npm test --prefix server

      - name: Build Android APK
        env:
          COACH_API_BASE_URL: ${{ vars.COACH_API_BASE_URL }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build_apk.sh

      - name: Save APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: imtahan-hazirligi-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: site/downloads/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_file="$(jq -r .filename site/downloads/latest.json)"
          version="$(jq -r .version site/downloads/latest.json)"
          tag="apk-${version}-build${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "site/downloads/$apk_file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "site/downloads/$apk_file" \
              --title "İmtahan 90+ ${version} (build ${GITHUB_RUN_NUMBER})" \
              --notes "Automated APK build from commit ${GITHUB_SHA}." \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website and APK
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
